output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
description: >-
  Counts macOS exec events per host and executable basename. The Aggregations
  function consumes every event on its route and emits only aggregates, one per
  host and executable in each 60 s window. Publishes macos_process_starts_total.
functions:
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: exe
          value: "(exe_path || '').split('/').pop()"
  - id: aggregation
    filter: "true"
    disabled: false
    conf:
      aggregations:
        - "count().as(starts)"
      groupbys:
        - host
        - exe
      timeWindow: 60s
      cumulative: true
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: source
          value: "'cc-stream-macos-fanout-io'"
        - name: _time
          value: "_time || Date.now() / 1000"
        - name: index
          value: "'os_metrics'"
        - name: _metric
          value: "'macos_process_starts_total'"
        - name: _value
          value: "starts"
  - id: publish_metrics
    filter: "true"
    disabled: false
    conf:
      metricNameField: _metric
      valueField: _value
      dimensions:
        - host
        - exe
