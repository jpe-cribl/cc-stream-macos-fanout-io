id: default
groups: {}
comments: []
routes:
  # Exec events are cloned to the process-starts pipeline (final: false). The
  # original event then reaches the check-in route, which consumes it.
  - id: process_exec_starts
    name: Process Exec Starts
    final: false
    disabled: false
    pipeline: macos_process_starts
    description: Counts macOS exec events per host and executable basename.
    enableOutputExpression: false
    targetContext: group
    filter: "event_type=='exec'"
    clones: []
    output: __group
  - id: process_app_checkins
    name: Process App Check-ins
    final: true
    disabled: false
    pipeline: macos_app_checkins
    description: Counts macOS app bundle launches per host and bundle name.
    enableOutputExpression: false
    targetContext: group
    filter: "sourcetype=='macos:process:lifecycle'"
    clones: []
    output: __group
  - id: launchd_spawns
    name: Launchd Spawns
    final: true
    disabled: false
    pipeline: macos_launchd_spawns
    description: Counts launchd spawn lines per host and service label.
    enableOutputExpression: false
    targetContext: group
    filter: "sourcetype=='macos:unified_log'"
    clones: []
    output: __group
  - id: ws_monitor_gap
    name: WindowServer Monitor Gap
    final: true
    disabled: false
    pipeline: macos_ws_monitor_gap
    description: Reports the largest WindowServer monitor loop gap per window.
    enableOutputExpression: false
    targetContext: group
    filter: "sourcetype=='ws-monitor'"
    clones: []
    output: __group
