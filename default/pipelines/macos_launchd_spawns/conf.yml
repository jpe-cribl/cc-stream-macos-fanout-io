output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
description: >-
  Counts launchd spawn lines per host and service label. A spawn line is a
  launchd event whose text starts with "Successfully spawned <label>[<pid>]".
  Non-spawn lines are dropped before aggregation. Publishes
  macos_launchd_spawns_total.
functions:
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: label
          value: >-
            process === 'launchd' && (/Successfully spawned ([^\[\s]+)/.exec(_raw || '') || [])[1] || ''
  - id: drop
    filter: "label == ''"
    disabled: false
    conf: {}
  - id: aggregation
    filter: "true"
    disabled: false
    conf:
      metricsMode: true
      aggregations:
        - "count().where(label != '').as(macos_launchd_spawns_total)"
      groupbys:
        - host
        - label
      timeWindow: 60s
      cumulative: true
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: source
          value: "'cc-stream-macos-fanout-io'"
        - name: _time
          value: "_time || Date.now() / 1000"
        - name: index
          value: "'os_metrics'"
