output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
description: >-
  Counts launchd spawn lines per host and service label. A spawn line is a
  launchd event whose text starts with "Successfully spawned <label>[<pid>]".
  The Aggregations function consumes every event on its route and emits only
  aggregates, and non-spawn lines add nothing to the count. Publishes
  macos_launchd_spawns_total.
functions:
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: label
          value: >-
            process === 'launchd' && (/Successfully spawned ([^\[\s]+)/.exec(_raw || '') || [])[1] || ''
  - id: aggregation
    filter: "true"
    disabled: false
    conf:
      aggregates:
        - "count().where(label != '').as(spawns)"
      groupByFields:
        - host
        - label
      timeWindow: 60s
      lagTolerance: 10s
      idleBucketTimeLimit: 10s
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: source
          value: "'cc-stream-macos-fanout-io'"
        - name: _time
          value: "_time || Date.now() / 1000"
  - id: publish_metrics
    filter: "true"
    disabled: false
    conf:
      metrics:
        - field: spawns
          metricName: "'macos_launchd_spawns_total'"
          type: counter
      dimensions:
        - host
        - label
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: index
          value: "'os_metrics'"
