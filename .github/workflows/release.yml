name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]

permissions: {}

jobs:
  release:
    if: ${{ github.event_name == 'pull_request' || github.event.repository.is_template == false }}
    uses: JacobPEvans/.github/.github/workflows/_release.yml@v1
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}

  # Build and attach pack assets before publishing the draft release.
  assets:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: jpe-cribl/.github/.github/workflows/cribl-pack-release.yml@b5a2249872c761f9462b60abf67b11d89473bf8d # main
    with:
      tag: ${{ needs.release.outputs.tag_name }}

  publish:
    needs: [release, assets]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.GH_ACTION_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write

      # The App token, not GITHUB_TOKEN: publishing with GITHUB_TOKEN emits no
      # release: published event for downstream on: release workflows.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # No checkout in this job, so gh cannot infer the repo from a git remote.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false
