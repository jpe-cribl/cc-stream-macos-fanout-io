name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Runs on the template too — the template now ships a working demo
    # passthrough pipeline + fixture so the harness gets exercised here
    # before consumer repos inherit it.
    uses: jpe-cribl/.github/.github/workflows/cribl-pack-test.yml@5dcd33ccad606deb3f4769d9511d7f10e09b391f # main
    with:
      # CHANGE per pack: 'edge' for Cribl Edge packs, 'stream' for Cribl Stream packs.
      pack_type: stream

  pack-tests:
    # Always reports on every PR, so rulesets can require it.
    name: Pack tests
    needs: test
    if: always()
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Require the pack test jobs to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
